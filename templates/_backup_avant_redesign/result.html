               <script>
    function fixCardInput(input) {
    // Map French AZERTY symbols to digits
    const symbolToDigit = {
        '&': '1',
        'é': '2',
        '"': '3',
        "'": '4',
        '(': '5',
        '-': '6',
        'è': '7',
        '_': '8',
        'ç': '9',
        'à': '0'
    };
    input.value = input.value.split('').map(char => symbolToDigit[char] || char).join('');
}
</script>
    <script>

        function goToIndexPage() {
            window.location.href = "/"; 
           
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                const userInput = document.getElementById("hidden_input").value;
    
                if (userInput.length >= 8) {
                    document.getElementById("input_form").submit(); // Submit the form
                    document.getElementById("hidden_input").value = ""; // Reset the input field
                }
            }
        }
        
    </script>
